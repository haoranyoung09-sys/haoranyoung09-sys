<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 232" width="100%" role="img" aria-label="Silas Yang (Haoran Yang)">
  <style>
    .card { fill: #fafafa; stroke: #e5e7eb; }
    .line { stroke: #e5e7eb; }
    .motif { stroke: #d1d5db; fill: none; }
    .motif-dot { fill: #9ca3af; }
    .eyebrow { fill: #6b7280; }
    .title { fill: #111827; }
    .alias { fill: #6b7280; }
    .subtitle { fill: #374151; }
    .meta { fill: #6b7280; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #30363d; }
      .line { stroke: #21262d; }
      .motif { stroke: #30363d; fill: none; }
      .motif-dot { fill: #6e7681; }
      .eyebrow { fill: #8b949e; }
      .title { fill: #f0f6fc; }
      .alias { fill: #8b949e; }
      .subtitle { fill: #c9d1d9; }
      .meta { fill: #8b949e; }
    }
  </style>

  <!-- Minimalist Card Surface -->
  <rect class="card" x="8" y="8" width="824" height="216" rx="14" stroke-width="1" />

  <!-- Subtle Hairline Geometric Motif (Right) -->
  <g transform="translate(718, 116)">
    <circle class="motif" cx="0" cy="0" r="64" stroke-width="0.9" />
    <circle class="motif" cx="0" cy="0" r="42" stroke-width="0.9" stroke-dasharray="3 4" />
    <line class="motif" x1="-76" y1="0" x2="76" y2="0" stroke-width="0.8" />
    <line class="motif" x1="0" y1="-76" x2="0" y2="76" stroke-width="0.8" />
    <circle class="motif-dot" cx="0" cy="0" r="2.5" />
    <circle class="motif-dot" cx="42" cy="0" r="2" />
    <circle class="motif-dot" cx="-30" cy="-30" r="2" />
  </g>

  <!-- Typography -->
  <text class="eyebrow" x="44" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" letter-spacing="2.2">
    UNNC · ENGINEERING GROUP · YEAR 1
  </text>

  <text x="44" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <tspan class="title" font-weight="600" font-size="32" letter-spacing="-0.4">Silas Yang</tspan>
    <tspan class="alias" font-weight="400" font-size="18" dx="10">(Haoran Yang)</tspan>
  </text>

  <text class="subtitle" x="44" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15">
    Engineering Group @ University of Nottingham Ningbo China
  </text>

  <!-- Hairline Divider -->
  <line class="line" x1="44" y1="164" x2="580" y2="164" stroke-width="1" />

  <!-- Stack Summary -->
  <text class="meta" x="44" y="192" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
    Rust · C++ · Python · PyTorch · ROS2 · Ubuntu 24.04
  </text>
</svg>
