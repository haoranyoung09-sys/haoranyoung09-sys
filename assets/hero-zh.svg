<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 270" width="100%" role="img" aria-label="Silas Yang (Haoran Yang) Profile Banner">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="accentBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94a3b8" stroke-width="0.6" opacity="0.08" />
    </pattern>
    <clipPath id="cardClip">
      <rect x="8" y="8" width="824" height="254" rx="16" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Background & Blueprint Grid -->
    <rect x="8" y="8" width="824" height="254" fill="url(#bgGrad)" />
    <rect x="8" y="8" width="824" height="254" fill="url(#grid)" />

    <!-- Subtle Ambient Glows -->
    <circle cx="715" cy="155" r="130" fill="#38bdf8" opacity="0.06" />
    <circle cx="140" cy="230" r="110" fill="#f97316" opacity="0.05" />

    <!-- Top Accent Strip -->
    <rect x="8" y="8" width="824" height="3" fill="url(#accentBar)" />

    <!-- Terminal Title Bar -->
    <rect x="8" y="11" width="824" height="36" fill="#161b22" opacity="0.88" />
    <line x1="8" y1="47" x2="832" y2="47" stroke="#30363d" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="32" cy="29" r="5.5" fill="#ff5f56" />
    <circle cx="52" cy="29" r="5.5" fill="#ffbd2e" />
    <circle cx="72" cy="29" r="5.5" fill="#27c93f" />

    <!-- Terminal Title -->
    <text x="420" y="33" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5">
      silas@ubuntu-24.04: ~/haoranyoung09-sys
    </text>

    <!-- Right-side Geometric Robotics / Systems Graph -->
    <g transform="translate(710, 152)">
      <circle cx="0" cy="0" r="68" fill="none" stroke="#30363d" stroke-width="1" />
      <circle cx="0" cy="0" r="52" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.55">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="36s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="32" fill="none" stroke="#f97316" stroke-width="1" stroke-dasharray="4 5" opacity="0.45">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="24s" repeatCount="indefinite" />
      </circle>

      <!-- Node Edges -->
      <line x1="0" y1="-44" x2="38" y2="24" stroke="#64748b" stroke-width="1.2" opacity="0.65" />
      <line x1="38" y1="24" x2="-38" y2="24" stroke="#64748b" stroke-width="1.2" opacity="0.65" />
      <line x1="-38" y1="24" x2="0" y2="-44" stroke="#64748b" stroke-width="1.2" opacity="0.65" />

      <!-- Core Node -->
      <circle cx="0" cy="2" r="9" fill="#161b22" stroke="#e2e8f0" stroke-width="1.8" />
      <circle cx="0" cy="2" r="3.5" fill="#38bdf8" />

      <!-- Outer Nodes (Rust / ROS2 / Terminal) -->
      <circle cx="0" cy="-44" r="6.5" fill="#f97316" />
      <circle cx="38" cy="24" r="6.5" fill="#38bdf8" />
      <circle cx="-38" cy="24" r="6.5" fill="#10b981" />
    </g>

    <!-- Left Content -->
    <text x="38" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5">
      <tspan fill="#10b981">$</tspan>
      <tspan fill="#79c0ff"> whoami</tspan>
    </text>

    <text x="38" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-weight="700" font-size="30" fill="#f8fafc">
      Silas Yang
      <tspan font-weight="400" font-size="18" fill="#94a3b8" dx="8">(Haoran Yang)</tspan>
    </text>

    <text x="38" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14.5" fill="#a5d6ff">
      宁波诺丁汉大学 (UNNC) · Engineering Group · 大一在读
    </text>

    <text x="38" y="196" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5">
      <tspan fill="#10b981">$</tspan>
      <tspan fill="#79c0ff"> cat</tspan>
      <tspan fill="#e2e8f0"> stack.txt</tspan>
    </text>

    <text x="38" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" fill="#cbd5e1">
      <tspan fill="#f97316">&gt;</tspan> Rust · C++ · Python · PyTorch · ROS2 · Ubuntu 24.04
    </text>

    <!-- Blinking Terminal Cursor -->
    <rect x="498" y="213" width="8" height="16" rx="1.5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Outer Border -->
  <rect x="8" y="8" width="824" height="254" rx="16" fill="none" stroke="#30363d" stroke-width="1.2" />
</svg>
